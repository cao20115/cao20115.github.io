<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script>
        hljs.highlightAll();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: '等线', 'Microsoft YaHei UI', '微软雅黑', 'SimSun', '宋体', sans-serif;
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ef 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.10);
            padding: 40px 32px 32px 32px;
        }
        
        h1 {
            font-size: 2.2em;
            color: #2d3a4b;
            margin-top: 0.5em;
            margin-bottom: 0.2em;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        hr {
            border: none;
            border-top: 2px solid #e0e7ef;
            margin: 1.5em 0 1.5em 0;
        }
        
        a,
        a:visited {
            color: #2563eb;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        a:hover {
            color: #1e40af;
            text-decoration: underline;
        }
        
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #fff !important;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 1em;
            margin-bottom: 1em;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #1e40af;
        }
        
        ol,
        ul {
            padding-left: 2em;
            margin-bottom: 1.2em;
        }
        
        pre {
            background: #23272e;
            color: #f8fafc;
            border-radius: 8px;
            padding: 1em 1.2em;
            overflow-x: auto;
            font-size: 1em;
            margin-bottom: 1.5em;
        }
        
        code {
            background: #f3f4f6;
            color: #d6336c;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.98em;
        }
        
        pre code {
            background: none;
            color: inherit;
            padding: 0;
        }
        
        blockquote {
            border-left: 4px solid #0c1f47;
            background: #f1f5fb;
            color: #374151;
            margin: 1.2em 0;
            padding: 0.8em 1.2em;
            border-radius: 6px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 16px 4vw 16px 4vw;
            }
            h1 {
                font-size: 1.3em;
            }
        }
    </style>
</head>

<body style="font-family: '等线', 'Microsoft YaHei UI', '微软雅黑', 'SimSun', '宋体', sans-serif;">

        <h1>一些有用（也许）的东西</h1>

        </ul>

        <div>
</body>

</html>
